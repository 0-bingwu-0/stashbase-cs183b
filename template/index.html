<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #15130f;
      --bg-tint: radial-gradient(
        ellipse 1100px 700px at 20% -10%,
        rgba(251, 146, 60, 0.07),
        transparent 60%
      );
      --surface: #1d1a15;
      --surface-soft: #25211b;
      --text: #f4ede0;
      --text-secondary: #b8ad99;
      --text-tertiary: #7a7060;
      --border: rgba(244, 237, 224, 0.08);
      --border-strong: rgba(244, 237, 224, 0.18);
      --accent: #fb923c;
      --accent-strong: #fdba74;
      --accent-soft: rgba(251, 146, 60, 0.12);
      --accent-glow: rgba(251, 146, 60, 0.22);
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "Source Serif 4", Georgia, "Songti SC", serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      background-image: var(--bg-tint);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 96px 32px 140px;
    }

    /* ── Header ───────────────────────────── */
    header.page-header {
      margin-bottom: 80px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 6px 12px 6px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-soft);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-strong);
      margin-bottom: 32px;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      margin-right: 10px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 56px;
      line-height: 1.05;
      letter-spacing: -0.022em;
      font-weight: 500;
      margin: 0 0 24px;
      max-width: 760px;
    }

    .lede {
      font-size: 17.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 620px;
      margin: 0;
    }

    /* ── Section label ────────────────────── */
    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .section-label .title {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
    }

    .section-label .title::before {
      content: "";
      width: 18px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .section-label .count {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Case list ────────────────────────── */
    .case-list {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: case-counter;
    }

    .case-list > li {
      counter-increment: case-counter;
    }

    article.case {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 34px 28px 38px;
      margin-top: 20px;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.3s ease,
        transform 0.25s ease, background 0.25s ease;
    }

    article.case::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
      opacity: 0.6;
      transition: opacity 0.25s ease, box-shadow 0.3s ease;
    }

    article.case:hover {
      border-color: var(--border-strong);
      background: var(--surface-soft);
      box-shadow: 0 18px 48px -24px var(--accent-glow),
        0 0 0 1px var(--accent-soft);
      transform: translateY(-2px);
    }

    article.case:hover::before {
      opacity: 1;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .case-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .case-name-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .case-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }

    .case-num::before {
      content: counter(case-counter, decimal-leading-zero);
    }

    .case-name {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.012em;
      margin: 0;
      color: var(--text);
    }

    .case-meta {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      text-transform: uppercase;
      flex-shrink: 0;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(244, 237, 224, 0.025);
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px 32px;
    }

    .case-block .label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .case-block p {
      font-size: 14px;
      line-height: 1.72;
      margin: 0;
      color: var(--text);
    }

    .case-block.pattern {
      padding: 16px 18px;
      background: linear-gradient(
        135deg,
        var(--accent-soft),
        rgba(251, 146, 60, 0.04)
      );
      border: 1px solid var(--accent-soft);
      border-radius: 8px;
      align-self: start;
    }

    .case-block.pattern .label {
      color: var(--accent);
    }

    .case-block.pattern p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14.5px;
      color: var(--accent-strong);
      line-height: 1.6;
    }

    /* ── Footer ───────────────────────────── */
    footer {
      margin-top: 88px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
    }

    /* ── Entrance animation ───────────────── */
    header.page-header,
    .section-label,
    .case-list > li,
    footer {
      animation: fadeUp 0.6s ease backwards;
    }

    header.page-header { animation-delay: 0s; }
    .section-label    { animation-delay: 0.08s; }
    .case-list > li:nth-child(1) { animation-delay: 0.14s; }
    .case-list > li:nth-child(2) { animation-delay: 0.2s; }
    .case-list > li:nth-child(3) { animation-delay: 0.26s; }
    .case-list > li:nth-child(4) { animation-delay: 0.32s; }
    .case-list > li:nth-child(5) { animation-delay: 0.38s; }
    .case-list > li:nth-child(n + 6) { animation-delay: 0.44s; }
    footer { animation-delay: 0.5s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ───────────────────────── */
    @media (max-width: 820px) {
      main { padding: 64px 22px 96px; }
      header.page-header { margin-bottom: 56px; }
      h1 { font-size: 38px; }
      .lede { font-size: 16px; }
      article.case { padding: 24px 22px 22px; }
      .case-grid { grid-template-columns: 1fr; gap: 22px; }
      .case-name { font-size: 22px; }
      .case-header { gap: 10px; }
    }
  </style>
</head>

<body>
  <main>
    <header class="page-header">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{heading}}</h1>
      <p class="lede">{{lede}}</p>
    </header>

    <div class="section-label">
      <span class="title">{{section_title}}</span>
      <span class="count">{{card_count}} entries</span>
    </div>

    <ol class="case-list">
{{cards}}
    </ol>

    <footer>{{footer}}</footer>
  </main>
</body>
</html>
